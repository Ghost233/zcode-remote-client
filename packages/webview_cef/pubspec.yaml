name: webview_cef
description: >
  内嵌副本：仅保留 macOS 实现（CEF/Chromium WebView，修 macOS 内嵌
  WKWebView 的中文输入法问题）。Windows/Linux/Android/iOS 平台的注册
  已删除——原版会把这些平台也拉进 CEF（Windows 包会从 12MB 涨到
  100MB+），本仓库其他平台继续用 flutter_inappwebview。上游：
  https://github.com/hlwhl/webview_cef （v0.6.1, Apache-2.0）
version: 0.6.1
homepage: https://github.com/hlwhl/webview_cef
repository: https://github.com/hlwhl/webview_cef

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: WebviewCefPlugin
