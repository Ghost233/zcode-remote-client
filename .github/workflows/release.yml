# 发版流水线（版本号完全由代码定义）：
# - 推 main 且版本有更新（pubspec.yaml / RELEASE_NOTES.md 变化）→ 自动出
#   全平台包并发布 Release，tag 由 CI 按 pubspec 版本打，不手写 tag。
# - 版本升了但构建失败时，后续修复提交（源码/平台配置/本工作流）会自动
#   重新构建发布，无需再改版本号；版本与最新 Release 一致后自动跳过。
# - 手动触发(workflow_dispatch) → 强制构建；版本与最新 Release 不同才发布。
# - 只允许 main 分支运行，不支持指定 commit 构建。
#
# 版本三要素（全部来自被编译的 commit，无人工维护项）：
#   X.Y.Z   ← pubspec.yaml（发版时手动 +0.0.1）
#   构建号  ← 提交数 + 1000（自动单调递增；余量保证高于旧手工 +N 方案）
#   短哈希  ← commit SHA 前 6 位，经 --dart-define 注入 app（设置页可见）
#             并附加到产物文件名（如 ...-v1.1.4-a1b2c3.apk），包 ↔ 源码可精确对应
name: release

on:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'RELEASE_NOTES.md'
      - 'lib/**'
      - 'packages/**'
      - 'android/**'
      - 'macos/**'
      - 'windows/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: 版本与发布判定
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build-number: ${{ steps.meta.outputs.build_number }}
      hash6: ${{ steps.meta.outputs.hash6 }}
      run-builds: ${{ steps.meta.outputs.run_builds }}
      do-release: ${{ steps.meta.outputs.do_release }}
    steps:
      - name: 只允许 main 分支（不支持指定 commit 构建）
        if: github.ref != 'refs/heads/main'
        run: |
          echo "本流水线只允许在 main 分支运行"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 提交计数需要完整历史

      - name: 计算版本 / 构建号 / 短哈希 / 是否发布
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' \r')
          VERSION=${VERSION%%+*}
          COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COUNT + 1000))
          HASH6=${GITHUB_SHA::6}
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ "v$VERSION" = "$LATEST" ]; then
            DO_RELEASE=false
          else
            DO_RELEASE=true
          fi
          # push 时版本没有更新（如仅改依赖碰了 pubspec）→ 不值得跑全套构建
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$DO_RELEASE" = "false" ]; then
            RUN_BUILDS=false
          else
            RUN_BUILDS=true
          fi
          {
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "hash6=$HASH6"
            echo "run_builds=$RUN_BUILDS"
            echo "do_release=$DO_RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "版本=$VERSION 构建号=$BUILD_NUMBER 哈希=$HASH6 最新Release=${LATEST:-无} 构建=$RUN_BUILDS 发布=$DO_RELEASE"

  android:
    name: Android 三架构 APK
    needs: prepare
    if: needs.prepare.outputs.run-builds == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_NAME: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      BUILD_HASH: ${{ needs.prepare.outputs.hash6 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: 解码正式签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zcode-release.keystore"

      - name: 预接受 SDK 许可（缺失的 NDK 由 Gradle 自动下载）
        run: yes | sdkmanager --licenses > /dev/null || true

      - run: flutter pub get

      - name: 构建（分架构 + 混淆 + 正式签名）
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/zcode-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: zcode
        run: |
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/symbols-android \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=BUILD_HASH="$BUILD_HASH"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/zcode-remote-client-android-$abi-v$BUILD_NAME-$BUILD_HASH.apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/

  macos:
    name: macOS DMG（arm64）
    needs: prepare
    if: needs.prepare.outputs.run-builds == 'true'
    # 钉住 macos-26 镜像 + Xcode 26.3：flutter_inappwebview_macos 1.2.0-beta.3
    # 的 WebAuthenticationSession.swift 类声明未加 @available 门控就遵从
    # ASWebAuthenticationPresentationContextProviding（实现方法却标注 10.15），
    # Xcode 26.6 的 Swift 检查器在部署目标 10.14 下直接报错；26.3 可编译。
    # 插件修复后可解除 DEVELOPER_DIR 钉扎（届时同步升 macos-26 镜像标签）。
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app
      BUILD_NAME: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      BUILD_HASH: ${{ needs.prepare.outputs.hash6 }}
      # webview_cef 的 wrapper 默认编 Debug；release 应用必须配 Release 版
      # wrapper（DCHECK 改 ABI），flutter build 内部的 pod install 读此变量。
      CEF_WRAPPER_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      # webview_cef：pod install 的 prepare_command 用 cmake/ninja 编译 CEF
      # wrapper，首次还会下载约 330MB 的 CEF 标准发行版（构建时间增加）。
      - run: brew install cmake ninja

      - run: flutter pub get

      # 先单独 pod install（flutter build 内部会复用），并打印生成的
      # Pods-Runner xcconfig——webview_cef 框架名带空格，链接参数的分词
      # 问题定位依赖这份内容（上游 issue #27/#178）。
      - name: pod install（含 xcconfig 诊断输出）
        run: |
          cd macos && pod install
          echo "===== Pods-Runner.release.xcconfig ====="
          cat "Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig" || true
          echo "===== webview_cef.release.xcconfig ====="
          cat "Pods/Target Support Files/webview_cef/webview_cef.release.xcconfig" || true

      - run: >-
          flutter build macos --release --obfuscate
          --split-debug-info=build/symbols-macos
          --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          --dart-define=BUILD_HASH="$BUILD_HASH"

      # CEF 只提供本机架构（CI 是 arm64）二进制，podspec 已剔除 x86_64
      # 切片，产物即 arm64 单架构——不再像从前那样 universal 构建再剥双
      # 架构。Intel Mac 待上游 universal 支持（webview_cef#30）后恢复。
      - name: 打 DMG（arm64 单架构）
        run: |
          mkdir -p dist
          APP="build/macos/Build/Products/Release/ZCode远程客户端.app"
          codesign --force --deep --sign - "$APP"
          DMGROOT="$RUNNER_TEMP/dmgroot"
          rm -rf "$DMGROOT"; mkdir -p "$DMGROOT"
          cp -R "$APP" "$DMGROOT/"
          ln -s /Applications "$DMGROOT/Applications"
          hdiutil create -volname "ZCode远程客户端" -srcfolder "$DMGROOT" \
            -format UDZO -ov "dist/zcode-remote-client-macos-arm64-v$BUILD_NAME-$BUILD_HASH.dmg" > /dev/null
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmgs
          path: dist/

  windows:
    name: Windows x64 zip
    needs: prepare
    if: needs.prepare.outputs.run-builds == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      BUILD_NAME: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      BUILD_HASH: ${{ needs.prepare.outputs.hash6 }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: >-
          flutter build windows --release --obfuscate
          --split-debug-info=build/symbols-windows
          --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          --dart-define=BUILD_HASH="$BUILD_HASH"
        env:
          # flutter_inappwebview_windows 用 <experimental/coroutine>（/await），
          # 最新 MSVC STL 把它升级成硬错误 STL1011；微软官方开关压掉，
          # 通过 CL 环境变量注入对插件子工程也生效。注意必须用 -D 而不是
          # /D：Git-Bash 会把 /D 开头的环境变量值做路径转换成 C:\...\D，
          # 传给 cl 就成了乱参数（表现为 CMake 找不到 C++ 编译器）。
          CL: -D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      # 产物是 exe + dll + data 一整套，整个 Release 目录打成 zip
      - name: 打 zip
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/zcode-remote-client-windows-x64-v$BUILD_NAME-$BUILD_HASH.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/

  release:
    name: 发布 Release
    needs: [prepare, android, macos, windows]
    if: >-
      !cancelled() &&
      needs.prepare.outputs.run-builds == 'true' &&
      needs.prepare.outputs.do-release == 'true' &&
      needs.android.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      HASH6: ${{ needs.prepare.outputs.hash6 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          # 上传用的是 v7（未记录产物摘要），v8 下载默认严格校验摘要会
          # 误报 digest-mismatch；降为警告。
          digest-mismatch: warn
          path: dist
          merge-multiple: true

      - name: 校验发布说明（RELEASE_NOTES.md 是 Release 正文，必须随版本一起提交）
        run: |
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "RELEASE_NOTES.md 缺失或为空：请写好发布说明后重新提交"
            exit 1
          fi

      - name: 创建 Release（tag 按 pubspec 版本打在本 commit 上）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "由 commit $HASH6 自动构建发布。"
            echo ""
            cat RELEASE_NOTES.md
          } > /tmp/notes.md
          cd dist
          ls -lh
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md \
            zcode-remote-client-android-arm64-v8a-*.apk \
            zcode-remote-client-android-armeabi-v7a-*.apk \
            zcode-remote-client-android-x86_64-*.apk \
            zcode-remote-client-macos-arm64-*.dmg \
            zcode-remote-client-macos-x86_64-*.dmg \
            zcode-remote-client-windows-x64-*.zip
          # arm64 APK 必须第一个上传（旧版本应用内更新器固定取第一个 .apk）
