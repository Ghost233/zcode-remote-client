# 发版流水线：推 v* tag 自动出包发布；手动触发(workflow_dispatch)只构建不发布。
# 产物与顺序和本地手动流程保持一致（arm64 APK 必须第一个上传，
# 旧版本应用内更新器固定取第一个 .apk）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  android:
    name: Android 三架构 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 解码正式签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zcode-release.keystore"

      - name: 预接受 SDK 许可（缺失的 NDK 由 Gradle 自动下载）
        run: yes | sdkmanager --licenses > /dev/null || true

      - run: flutter pub get

      - name: 构建（分架构 + 混淆 + 正式签名）
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/zcode-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: zcode
        run: |
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/symbols-android
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/zcode-remote-client-android-$abi-v$V.apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: dist/

  macos:
    name: macOS 双架构 DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build macos --release --obfuscate --split-debug-info=build/symbols-macos

      # Flutter 产物是 universal：分别剥出 arm64 / x86_64，重签名后各打 DMG
      #（含拖拽安装的 Applications 符号链接，与本地手动流程一致）。
      - name: 剥架构 + 打 DMG
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          mkdir -p dist
          for ARCH in arm64 x86_64; do
            DST="$RUNNER_TEMP/macapp-$ARCH.app"
            rm -rf "$DST"
            cp -R build/macos/Build/Products/Release/zcode_remote_client.app "$DST"
            find "$DST" -type f \( -name 'zcode_remote_client' -o -name 'App' -o -name 'FlutterMacOS' \) |
              while read f; do
                lipo -thin $ARCH -output /tmp/_thin "$f" 2>/dev/null && mv /tmp/_thin "$f"
              done
            codesign --force --deep --sign - "$DST"
            DMGROOT="$RUNNER_TEMP/dmgroot-$ARCH"
            rm -rf "$DMGROOT"; mkdir -p "$DMGROOT"
            cp -R "$DST" "$DMGROOT/"
            ln -s /Applications "$DMGROOT/Applications"
            hdiutil create -volname "ZCode远程客户端" -srcfolder "$DMGROOT" \
              -format UDZO -ov "dist/zcode-remote-client-macos-$ARCH-v$V.dmg" > /dev/null
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmgs
          path: dist/

  windows:
    name: Windows x64 zip
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release --obfuscate --split-debug-info=build/symbols-windows

      # 产物是 exe + dll + data 一整套，整个 Release 目录打成 zip
      - name: 打 zip
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/dist/zcode-remote-client-windows-x64-v$V.zip" .

      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: dist/

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 取 tag 注释作发布说明

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 校验 tag 与 pubspec 版本一致（应用内更新依赖二者匹配）
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 pubspec 版本 v$V 不一致"
            exit 1
          fi

      - name: 生成发布说明（取 tag 注释）
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/notes.md

      - name: 创建 Release（arm64 APK 必须第一个上传）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ls -lh
          gh release create "$GITHUB_REF_NAME" \
            zcode-remote-client-android-arm64-v8a-*.apk \
            zcode-remote-client-android-armeabi-v7a-*.apk \
            zcode-remote-client-android-x86_64-*.apk \
            zcode-remote-client-macos-arm64-*.dmg \
            zcode-remote-client-macos-x86_64-*.dmg \
            zcode-remote-client-windows-x64-*.zip \
            --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
